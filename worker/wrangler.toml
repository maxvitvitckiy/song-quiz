# Cloudflare Worker that runs the online buzzer rooms. See README.md ("Room server").
name = "song-quiz-rooms"
main = "src/index.js"
compatibility_date = "2025-09-01"

[vars]
# Pages allowed to open rooms (comma-separated). `npm run dev` also allows localhost.
ALLOWED_ORIGINS = "https://maxvitvitckiy.github.io"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
